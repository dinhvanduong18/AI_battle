databases:
  - name: ottv2-db
    databaseName: ottv2
    user: ott
    plan: free

services:
  - type: keyvalue
    name: ottv2-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: ottv2-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ottv2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ottv2-redis
          property: connectionString
      - key: FIDE_K_FACTOR
        value: "20"
